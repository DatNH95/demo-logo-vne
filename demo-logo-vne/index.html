<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo logo VnExpress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f3f1; color: #302d29; font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd8d4; }
  h1 { flex-basis: 100%; margin: 0; font: 700 clamp(20px, 3vw, 26px)/1.25 "Merriweather", Georgia, serif; }
  .filter-row { flex-basis: 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
  .season { font: inherit; font-weight: 650; color: #861b43; background: #fff; border: 1px solid #d6ccc9; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  .empty-season { max-width: 640px; margin: 28px auto; padding: 20px; text-align: center; }
  button { font: inherit; color: inherit; background: #fff; border: 1px solid #d6ccc9; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  button[aria-pressed="true"] { background: #9f224e; border-color: #9f224e; color: #fff; }
  [role="group"] { display: flex; flex-wrap: wrap; gap: 6px; }
  .options-menu { flex-basis: 100%; border-top: 1px solid #eee9e7; padding-top: 10px; }
  .options-menu[hidden] { display: none; }
  .options-menu button { padding: 4px 12px; font-size: 14px; }
  .options-menu button[aria-pressed="true"] { background: #f9eaf0; border-color: #cf9aae; color: #861b43; }
  .edition-menu[hidden] { display: none; }
  .edition-menu { margin-left: auto; }
  .edition-menu button { font-size: 13px; }
  main { padding: 18px; }
  .preview { position: relative; margin: 0 auto; background: white; border: 1px solid #dedbd7; overflow: hidden; }
  #pc, #pc-do { max-width: 1922px; }
  #mobile, #mobile-do { max-width: 414px; border-inline: 0; }
  .homepage { width: 100%; height: auto; display: block; }
  .motion-background, .brand-logo, .sidebar-ad, .account-icon { display: block; position: absolute; }
  #mobile .motion-background, #mobile-do .motion-background { mask-image: linear-gradient(90deg, transparent 10%, #000 14%, #000 90%, transparent 100%); }
  .account-icon { color: #757575; }
  #sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; max-width: 980px; margin: 0 auto; }
  #sources[hidden] { display: none; }
  .source-card { min-width: 0; padding: 18px; background: #fff; border: 1px solid #dedbd7; border-radius: 8px; }
  .source-card h2 { margin: 0 0 12px; font-size: 16px; }
  .source-card h2 span { font-size: 13px; color: #655f5b; font-weight: normal; }
  .source-image { display: block; width: auto; max-width: 100%; height: auto; margin-bottom: 14px; }
  .source-download { color: #8b1d45; font-weight: 600; }
  @media (max-width: 520px) {
    main { padding: 10px; }
    main:has(:is(#mobile, #mobile-do):not([hidden])) { padding-inline: 0; }
  }
</style>
<header>
  <h1>Demo logo VnExpress</h1>
  <div class="filter-row">
    <select class="season" aria-label="Dịp thiết kế">
      <option value="noel-2026">Noel 2026</option>
      <option value="tet-am-2027">Tết âm 2027</option>
    </select>
    <div role="group" aria-label="Phiên bản xem thử">
      <button type="button" data-section="pc" aria-pressed="false">PC</button>
      <button type="button" data-section="mobile" aria-pressed="false">Mobile</button>
      <button type="button" data-section="sources" aria-pressed="false">Tải xuống SVG</button>
    </div>
  </div>
  <div class="options-menu" role="group" aria-label="Phương án thiết kế" hidden>
    <button type="button" data-option="01" aria-pressed="false">Options 1</button>
<button type="button" data-option="02" aria-pressed="false">Options 2</button>
    <div class="edition-menu" role="group" aria-label="Ấn bản" hidden>
      <button type="button" data-edition="ov" aria-pressed="false">OV</button>
      <button type="button" data-edition="do" aria-pressed="true">DO</button>
    </div>
  </div>
  <span id="status" role="status"></span>
</header>
<main>
  <p class="empty-season" hidden>Chưa có phương án logo cho Tết âm 2027.</p>
  <div class="preview" id="pc" hidden>
    <img class="homepage" src="./asset/vnexpress-homepage-1920x1080.png" width="1920" height="1080" alt="Khung trang chủ VnExpress trên PC">
    <img class="motion-background" style="left:20%;top:0%;width:11.5625%;height:5.648148148148148%" alt="">
    <img class="brand-logo" src="./asset/vnexpress-logo.svg" style="left:21.354166666666664%;top:0.6481481481481481%;width:9.010416666666666%;height:4.2592592592592595%" alt="VnExpress — Báo tiếng Việt nhiều người xem nhất">
    <img class="sidebar-ad" src="./asset/vnexpress-demo-ad-300x600.png" width="300" height="600" style="left:63.020833333333336%;top:13.148148148148147%;width:15.625%;height:55.55555555555556%" alt="Quảng cáo One Era">
  </div>
<div class="preview" id="mobile" hidden>
    <img class="homepage" src="./asset/vnexpress-homepage-mobile.png" width="414" height="1080" alt="Khung trang chủ VnExpress trên Mobile">
    <img class="motion-background" style="left:0%;top:0%;width:100%;height:5.37037037037037%" alt="">
    <img class="brand-logo" src="./asset/vnexpress-logo.svg" style="left:30.07246376811594%;top:0.5555555555555556%;width:39.85507246376812%;height:4.037905092592593%" alt="VnExpress — Báo tiếng Việt nhiều người xem nhất">
    <svg class="account-icon" style="left:90.33816425120773%;top:1.2962962962962963%;width:5.797101449275362%;height:2.2222222222222223%" viewBox="0 0 24 24" role="img" aria-label="Tài khoản" fill="none" stroke="currentColor" stroke-width="1.45">
      <circle cx="12" cy="6.4" r="4"/>
      <path d="M6.5 14.2h11a2.1 2.1 0 0 1 2.1 2.1c0 2.9-3.1 4.7-7.6 4.7s-7.6-1.8-7.6-4.7a2.1 2.1 0 0 1 2.1-2.1Z"/>
    </svg>
  </div>
<div class="preview" id="pc-do" hidden>
    <img class="homepage" src="./asset/vnexpress-do-pc.png" width="1920" height="1080" alt="Khung trang chủ VnExpress trên PC DO">
    <img class="motion-background" style="left:10.478515625%;top:0.3703703703703704%;width:23.4375%;height:5.648148148148148%" alt="">
    <img class="brand-logo" src="./asset/vnexpress-do-logo.svg" style="left:17.1875%;top:0.9259259259259258%;width:10.01953125%;height:5%" alt="VnExpress International">
  </div>
<div class="preview" id="mobile-do" hidden>
    <img class="homepage" src="./asset/vnexpress-do-mobile.png" width="414" height="1080" alt="Khung trang chủ VnExpress trên Mobile DO">
    <img class="motion-background" style="left:0%;top:0%;width:100%;height:4.074074074074074%" alt="">
    <img class="brand-logo" src="./asset/vnexpress-do-logo.svg" style="left:10.869565217391305%;top:0.2777777777777778%;width:31.40096618357488%;height:3.7037037037037033%" alt="VnExpress International">
  </div>
  <section id="sources" aria-label="Nền SVG của các phương án" hidden>
    <article class="source-card" data-source="pc-01">
      <h2>PC 01 <span>· 450 × 61 px</span></h2>
      <img class="source-image" width="450" height="61" alt="Nền Giáng sinh PC 01">
      <a class="source-download">Tải SVG</a>
    </article>
<article class="source-card" data-source="pc-02">
      <h2>PC 02 <span>· 450 × 61 px</span></h2>
      <img class="source-image" width="450" height="61" alt="Nền Giáng sinh PC 02">
      <a class="source-download">Tải SVG</a>
    </article>
<article class="source-card" data-source="mobile-01">
      <h2>Mobile 01 <span>· 414 × 58 px</span></h2>
      <img class="source-image" width="414" height="58" alt="Nền Giáng sinh Mobile 01">
      <a class="source-download">Tải SVG</a>
    </article>
<article class="source-card" data-source="mobile-02">
      <h2>Mobile 02 <span>· 414 × 58 px</span></h2>
      <img class="source-image" width="414" height="58" alt="Nền Giáng sinh Mobile 02">
      <a class="source-download">Tải SVG</a>
    </article>
  </section>
</main>
<script>
  const variants = {"pc-01":{"layout":"pc","box":"left:14.0625%;top:0%;width:23.4375%;height:5.648148148148148%","svg":"./asset/vnexpress-noel-pc-01-motion.svg","png":"./asset/vnexpress-noel-pc-01%403x.png","filename":"vnexpress-noel-pc-01-motion.svg"},"pc-02":{"layout":"pc","box":"left:14.0625%;top:0%;width:23.4375%;height:5.648148148148148%","svg":"./asset/vnexpress-noel-pc-02-motion.svg","png":"./asset/vnexpress-noel-pc-02%403x.png","filename":"vnexpress-noel-pc-02-motion.svg"},"mobile-01":{"layout":"mobile","box":"left:0%;top:0%;width:100%;height:5.37037037037037%","svg":"./asset/vnexpress-noel-mobile-01-motion.svg","png":"./asset/vnexpress-noel-mobile-01%403x.png","filename":"vnexpress-noel-mobile-01-motion.svg"},"mobile-02":{"layout":"mobile","box":"left:0%;top:0%;width:100%;height:5.37037037037037%","svg":"./asset/vnexpress-noel-mobile-02-motion.svg","png":"./asset/vnexpress-noel-mobile-02%403x.png","filename":"vnexpress-noel-mobile-02-motion.svg"}};
  const sections = document.querySelectorAll('[data-section]');
  const optionsMenu = document.querySelector('.options-menu');
  const optionButtons = optionsMenu.querySelectorAll('[data-option]');
  const editionMenu = document.querySelector('.edition-menu');
  const editionButtons = editionMenu.querySelectorAll('[data-edition]');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const status = document.getElementById('status');
  const sources = document.getElementById('sources');
  const season = document.querySelector('.season');
  const emptySeason = document.querySelector('.empty-season');
  let active;
  let selectedOption = '01';
  let edition = new URLSearchParams(location.search).get('edition') === 'ov' ? 'ov' : 'do';
  let renderSequence = 0;

  async function selectPreview(id) {
    active = id;
    const sequence = ++renderSequence;
    const spec = variants[id];
    const section = spec?.layout ?? 'sources';
    const hasDesigns = season.value === 'noel-2026';
    if (spec) selectedOption = id.slice(-2);
    for (const button of sections) button.setAttribute('aria-pressed', button.dataset.section === section);
    optionsMenu.hidden = !hasDesigns || section === 'sources';
    const offersEdition = hasDesigns && !!spec;
    editionMenu.hidden = !offersEdition;
    for (const button of editionButtons) button.setAttribute('aria-pressed', button.dataset.edition === edition);
    for (const button of optionButtons) {
      button.hidden = !Object.hasOwn(variants, section + '-' + button.dataset.option);
      button.setAttribute('aria-pressed', button.dataset.option === selectedOption);
    }
    status.textContent = '';
    sources.hidden = !hasDesigns || id !== 'sources';
    emptySeason.hidden = hasDesigns;
    const showInternational = offersEdition && edition === 'ov';
    const frame = hasDesigns && spec ? document.getElementById(spec.layout + (showInternational ? '-do' : '')) : null;
    for (const preview of document.querySelectorAll('.preview')) preview.hidden = preview !== frame;
    if (!hasDesigns) {
      document.documentElement.dataset.ready = 'tet-am-2027';
      return;
    }
    let images;
    if (frame) {
      const background = frame.querySelector('.motion-background');
      if (!showInternational) background.style.cssText = spec.box;
      background.src = reducedMotion.matches ? spec.png : spec.svg;
      images = Array.from(frame.querySelectorAll('img'));
    } else {
      images = Array.from(sources.querySelectorAll('[data-source]'), card => {
        const variant = variants[card.dataset.source];
        const image = card.querySelector('img');
        const link = card.querySelector('a');
        if (!image.hasAttribute('src')) {
          image.src = variant.svg;
          link.href = variant.svg;
          link.download = variant.filename;
        }
        return image;
      });
    }
    try {
      await Promise.all(images.map(image => image.decode()));
      if (sequence === renderSequence) document.documentElement.dataset.ready = showInternational ? id + '-ov' : id;
    } catch {
      if (sequence === renderSequence) status.textContent = 'Không tải được ảnh xem thử.';
    }
  }

  for (const button of sections) button.addEventListener('click', () => {
    const section = button.dataset.section;
    selectPreview(section === 'sources' ? section : section + '-' + selectedOption);
  });
  for (const button of optionButtons) button.addEventListener('click', () => {
    const layout = variants[active]?.layout;
    if (layout) selectPreview(layout + '-' + button.dataset.option);
  });
  for (const button of editionButtons) button.addEventListener('click', () => {
    edition = button.dataset.edition;
    selectPreview(active);
  });
  reducedMotion.addEventListener('change', () => selectPreview(active));
  season.addEventListener('change', () => selectPreview(active));
  const requested = new URLSearchParams(location.search).get('view');
  selectPreview(Object.hasOwn(variants, requested) || requested === 'sources' ? requested : requested === 'mobile' ? 'mobile-01' : 'pc-01');
</script>
