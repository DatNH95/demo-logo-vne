<!doctype html>
<html lang="vi">
<meta charset="utf-8">

<title>Demo logo VnExpress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f3f1; color: #302d29; font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd8d4; }
  h1 { flex-basis: 100%; margin: 0; font: 700 clamp(20px, 3vw, 26px)/1.25 "Merriweather", Georgia, serif; }
  .filter-row { flex-basis: 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
  .season { font: inherit; font-weight: 650; color: #861b43; background: #fff; border: 1px solid #d6ccc9; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button { font: inherit; color: inherit; background: #fff; border: 1px solid #d6ccc9; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  button[aria-pressed="true"] { background: #9f224e; border-color: #9f224e; color: #fff; }
  [role="group"] { display: flex; flex-wrap: wrap; gap: 6px; }
  .options-menu { flex-basis: 100%; border-top: 1px solid #eee9e7; padding-top: 10px; }
  .options-menu[hidden] { display: none; }
  .options-menu button { padding: 4px 12px; font-size: 14px; }
  .options-menu button[aria-pressed="true"] { background: #f9eaf0; border-color: #cf9aae; color: #861b43; }
  .edition-menu[hidden] { display: none; }
  .edition-menu { margin-left: auto; }
  .edition-menu button { font-size: 13px; }
  .zoom-menu { align-items: center; }
  .zoom-menu button { min-width: 36px; }
  .zoom-menu button:disabled { opacity: .45; cursor: default; }
  .zoom-reset { min-width: 70px !important; font-variant-numeric: tabular-nums; }
  main { padding: 18px; }
  .demo-viewport { overflow: auto; }
  .demo-viewport[data-magnified] { max-height: 75vh; }
  .preview { position: relative; margin: 0 auto; background: white; border: 1px solid #dedbd7; overflow: hidden; }
  #pc, #pc-do { max-width: 1922px; }
  #mobile, #mobile-do, #app { max-width: 414px; border-inline: 0; }
  #app::before { content: ""; position: absolute; left: 28%; top: 6.1%; width: 46%; height: 5.7%; background: #171c22; }
  #app .motion-background {
    mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent), linear-gradient(180deg, transparent, #000 23%, #000 79%, transparent);
    mask-composite: intersect;
  }
  .homepage { width: 100%; height: auto; display: block; }
  .motion-background, .brand-logo, .sidebar-ad, .account-icon { display: block; position: absolute; }
  #mobile .motion-background { mask-image: linear-gradient(90deg, transparent 10%, #000 14%, #000 90%, transparent 100%); }
  #mobile[data-tet] .motion-background { mask-image: linear-gradient(90deg, transparent 9%, #000 14%, #000 87%, transparent 91%); }
  #mobile-do .motion-background { mask-image: linear-gradient(90deg, transparent 14%, #000 25%, #000 88%, transparent 100%); }
  .account-icon { color: #757575; }
  #sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; max-width: 980px; margin: 0 auto; }
  #sources[hidden] { display: none; }
  .source-card { min-width: 0; padding: 18px; background: #fff; border: 1px solid #dedbd7; border-radius: 8px; }
  .source-card h2 { margin: 0 0 12px; font-size: 16px; }
  .source-card h2 span { font-size: 13px; color: #655f5b; font-weight: normal; }
  .source-image { display: block; width: auto; max-width: 100%; height: auto; margin-bottom: 14px; }
  [data-source="app-01"] .source-image { background: #171c22; }
  .source-download { color: #8b1d45; font-weight: 600; }
  @media (max-width: 520px) {
    main { padding: 10px; }
    main:has(:is(#mobile, #mobile-do, #app):not([hidden])) { padding-inline: 0; }
  }
</style>
<header>
  <h1>Demo logo VnExpress</h1>
  <div class="filter-row">
    <select class="season" aria-label="Dịp thiết kế">
      <option value="noel-2026">Noel 2026</option>

    </select>
    <div role="group" aria-label="Phiên bản xem thử">
      <button type="button" data-section="pc" aria-pressed="false">PC</button>
      <button type="button" data-section="mobile" aria-pressed="false">Mobile</button>
      <button type="button" data-section="app" aria-pressed="false">App</button>
      <button type="button" data-section="sources" aria-pressed="false">Tải xuống SVG</button>
    </div>
  </div>
  <div class="options-menu" role="group" aria-label="Phương án thiết kế" hidden>
    <button type="button" data-option="01" aria-pressed="false">Options 1</button>
<button type="button" data-option="02" aria-pressed="false">Options 2</button>
    <div class="edition-menu" role="group" aria-label="Ấn bản" hidden>
      <button type="button" data-edition="ov" aria-pressed="false">OV</button>
      <button type="button" data-edition="do" aria-pressed="true">DO</button>
    </div>
    <div class="zoom-menu" role="group" aria-label="Thu phóng khung demo">
      <button type="button" data-zoom="-25" aria-label="Thu nhỏ">−</button>
      <button type="button" class="zoom-reset" data-zoom="reset" title="Đặt lại mức thu phóng" aria-label="Đặt lại mức thu phóng · 100%">100%</button>
      <button type="button" data-zoom="25" aria-label="Phóng to">+</button>
    </div>
  </div>
  <span id="status" role="status"></span>
</header>

<script>
  const variants = {"pc-01":{"layout":"pc","box":"left:10.9375%;top:0%;width:29.6875%;height:5.648148148148148%","svg":"./asset/vnexpress-noel-pc-01-motion.svg","png":"./asset/vnexpress-noel-pc-01%403x.png","filename":"vnexpress-noel-pc-01-motion.svg"},"pc-02":{"layout":"pc","box":"left:14.0625%;top:0%;width:23.4375%;height:5.648148148148148%","svg":"./asset/vnexpress-noel-pc-02-motion.svg","png":"./asset/vnexpress-noel-pc-02%403x.png","filename":"vnexpress-noel-pc-02-motion.svg"},"mobile-01":{"layout":"mobile","box":"left:0%;top:0%;width:100%;height:5.37037037037037%","svg":"./asset/vnexpress-noel-mobile-01-motion.svg","png":"./asset/vnexpress-noel-mobile-01%403x.png","filename":"vnexpress-noel-mobile-01-motion.svg"},"mobile-02":{"layout":"mobile","box":"left:0%;top:0%;width:100%;height:5.37037037037037%","svg":"./asset/vnexpress-noel-mobile-02-motion.svg","png":"./asset/vnexpress-noel-mobile-02%403x.png","filename":"vnexpress-noel-mobile-02-motion.svg"},"app-01":{"layout":"app","box":"left:18.84057971014493%;top:6.124721603563475%;width:62.31884057971014%;height:4.93008790079203%","svg":"./asset/vnexpress-app-noel-01.svg","png":"./asset/vnexpress-app-noel-01.svg","filename":"vnexpress-app-noel-01.svg"}};
  const tet = {"svg":"./asset/vnexpress-tet-01.svg","filename":"vnexpress-tet-01.svg","layouts":{"pc":"left:14.348958333333334%;top:0%;width:23.802083333333332%;height:5.555555555555555%","mobile":"left:1.6411378555798735%;top:0%;width:100%;height:5.032822757111597%","pc-do":"left:10.296223958333334%;top:0%;width:23.802083333333332%;height:5.555555555555555%","mobile-do":"left:-1.2077294685990339%;top:0%;width:55.55555555555556%;height:2.7960126428397762%;transform-origin:top;transform:scaleY(1.4571014492753624)"}};
  const internationalBoxes = {"pc-do":{"01":"left:7.353515625%;top:0%;width:29.6875%;height:5.648148148148148%","02":"left:10.478515625%;top:0%;width:23.4375%;height:5.648148148148148%"},"mobile-do":{"01":"left:-1.2077294685990339%;top:0%;width:55.55555555555556%;height:2.983539094650206%;transform-origin:top;transform:scaleY(1.3655172413793104)","02":"left:-1.2077294685990339%;top:0%;width:55.55555555555556%;height:2.983539094650206%;transform-origin:top;transform:scaleY(1.3655172413793104)"}};
  const sections = document.querySelectorAll('[data-section]');
  const optionsMenu = document.querySelector('.options-menu');
  const optionButtons = optionsMenu.querySelectorAll('[data-option]');
  const editionMenu = document.querySelector('.edition-menu');
  const editionButtons = editionMenu.querySelectorAll('[data-edition]');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const status = document.getElementById('status');
  const sources = document.getElementById('sources');
  const season = document.querySelector('.season');
  const viewport = document.querySelector('.demo-viewport');
  const zoomOut = document.querySelector('[data-zoom="-25"]');
  const zoomIn = document.querySelector('[data-zoom="25"]');
  const zoomReset = document.querySelector('[data-zoom="reset"]');
  let active;
  let selectedOption = '01';
  let edition = new URLSearchParams(location.search).get('edition') === 'ov' ? 'ov' : 'do';
  let renderSequence = 0;
  let visibleFrame;
  let zoom = 100;

  function applyZoom() {
    const available = viewport.clientWidth;
    if (!visibleFrame || !available) return;
    const maxWidth = visibleFrame.id.startsWith('mobile') || visibleFrame.id === 'app' ? 414 : 1922;
    visibleFrame.style.width = Math.min(available, maxWidth) + 'px';
    visibleFrame.style.zoom = zoom / 100;
    viewport.toggleAttribute('data-magnified', zoom > 100);
    zoomOut.disabled = zoom <= 50;
    zoomIn.disabled = zoom >= 200;
    zoomReset.textContent = zoom + '%';
    zoomReset.setAttribute('aria-label', 'Đặt lại mức thu phóng · ' + zoom + '%');
  }

  async function selectPreview(id) {
    const isTet = season.value === 'tet-am-2027';
    if (isTet && id.startsWith('app-')) id = 'pc-' + selectedOption;
    active = id;
    const sequence = ++renderSequence;
    const spec = variants[id];
    const section = spec?.layout ?? 'sources';
    if (spec && section !== 'app') selectedOption = id.slice(-2);
    for (const button of sections) {
      button.hidden = isTet && button.dataset.section === 'app';
      button.setAttribute('aria-pressed', button.dataset.section === section);
    }
    optionsMenu.hidden = section === 'sources';
    const offersEdition = !!spec && section !== 'app';
    editionMenu.hidden = !offersEdition;
    for (const button of editionButtons) button.setAttribute('aria-pressed', button.dataset.edition === edition);
    for (const button of optionButtons) {
      button.hidden = isTet ? button.dataset.option !== '01' : !Object.hasOwn(variants, section + '-' + button.dataset.option);
      button.setAttribute('aria-pressed', button.dataset.option === (isTet || section === 'app' ? '01' : selectedOption));
    }
    status.textContent = '';
    sources.hidden = id !== 'sources';
    const showInternational = offersEdition && edition === 'ov';
    const frame = spec ? document.getElementById(spec.layout + (showInternational ? '-do' : '')) : null;
    visibleFrame = frame;
    viewport.hidden = !frame;
    for (const preview of document.querySelectorAll('.preview')) preview.hidden = preview !== frame;
    applyZoom();
    let images;
    if (frame) {
      frame.toggleAttribute('data-tet', isTet);
      const background = frame.querySelector('.motion-background');
      background.style.cssText = isTet ? tet.layouts[frame.id] : showInternational ? internationalBoxes[frame.id][id.slice(-2)] : spec.box;
      background.src = isTet ? tet.svg : reducedMotion.matches ? spec.png : spec.svg;
      images = Array.from(frame.querySelectorAll('img'));
    } else {
      images = Array.from(sources.querySelectorAll('[data-source]')).flatMap(card => {
        card.hidden = card.dataset.season !== season.value;
        if (card.hidden) return [];
        const variant = isTet ? tet : variants[card.dataset.source];
        const image = card.querySelector('img');
        const link = card.querySelector('a');
        if (!image.hasAttribute('src')) {
          image.src = variant.svg;
          link.href = variant.svg;
          link.download = variant.filename;
        }
        return [image];
      });
    }
    try {
      await Promise.all(images.map(image => image.decode()));
      if (sequence === renderSequence) document.documentElement.dataset.ready = (isTet ? section + '-tet' : id) + (showInternational ? '-ov' : '');
    } catch {
      if (sequence === renderSequence) status.textContent = 'Không tải được ảnh xem thử.';
    }
  }

  for (const button of sections) button.addEventListener('click', () => {
    const section = button.dataset.section;
    selectPreview(section === 'sources' ? section : section + '-' + (section === 'app' ? '01' : selectedOption));
  });
  for (const button of optionButtons) button.addEventListener('click', () => {
    const layout = variants[active]?.layout;
    if (layout && season.value !== 'tet-am-2027') selectPreview(layout + '-' + button.dataset.option);
  });
  for (const button of editionButtons) button.addEventListener('click', () => {
    edition = button.dataset.edition;
    selectPreview(active);
  });
  document.querySelectorAll('[data-zoom]').forEach(button => button.addEventListener('click', () => {
    zoom = button.dataset.zoom === 'reset' ? 100 : Math.min(200, Math.max(50, zoom + Number(button.dataset.zoom)));
    applyZoom();
    if (zoom === 100) viewport.scrollTo(0, 0);
  }));
  new ResizeObserver(applyZoom).observe(viewport);
  reducedMotion.addEventListener('change', () => selectPreview(active));
  season.addEventListener('change', () => selectPreview(active));
  const params = new URLSearchParams(location.search);
  if (params.get('season') === 'tet-am-2027') season.value = 'tet-am-2027';
  const requested = params.get('view');
  selectPreview(Object.hasOwn(variants, requested) || requested === 'sources' ? requested : requested === 'mobile' ? 'mobile-01' : 'pc-01');
</script>
